<!--
  个人操盘工作台（Personal Ops Workbench）· 开源版
  一个人的短视频业务操作系统：任务 / 随手记录 / 素材库 / 选题 / 账号 / 客户CRM / 项目 / 回款 / 数据复盘

  两种运行模式（自动识别）：
  1. 平台模式：在 WorkBuddy 等平台内打开，通过平台注入的数据库 SDK 在线存储、多端同步
  2. 本地模式：直接用浏览器打开本文件，数据自动存入浏览器 localStorage（本机保存，建议定期用右上角「导出备份」）
-->
<style>
:root{
  --pri:#E8562A; --pri-soft:#FDEEE7; --bg:#F4F5F7; --card:#FFFFFF;
  --tx:#17181C; --tx2:#5C626B; --tx3:#9096A0; --line:#E7E9ED;
  --danger:#E5484D; --danger-soft:#FDEBEC; --warn:#E8930C; --warn-soft:#FDF3E0;
  --ok:#2E9E5B; --ok-soft:#E7F5EC; --blue:#3370FF; --blue-soft:#EBF1FF;
  --purple:#7B61FF; --purple-soft:#F1EEFF;
  --radius:18px; --shadow:0 1px 2px rgba(20,22,28,.04),0 10px 30px rgba(20,22,28,.07);
  --grad:linear-gradient(135deg,#E8562A,#F08A3C);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:14px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{resize:vertical;min-height:70px}
#app{display:flex;min-height:100vh}
/* ---------- 侧边导航 ---------- */
#nav{width:216px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#E8562A,#F5A623);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-logo svg{width:20px;height:20px;fill:#fff}
.brand b{font-size:15px;display:block;line-height:1.25}
.brand span{font-size:11px;color:var(--tx3)}
#nav-items{flex:1;overflow-y:auto;padding:4px 8px}
.nav-group{font-size:11px;color:var(--tx3);font-weight:600;padding:12px 12px 4px;letter-spacing:.05em}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;color:var(--tx2);font-size:14px;margin-bottom:2px;text-align:left}
.nav-item svg{width:17px;height:17px;fill:currentColor;flex-shrink:0}
.nav-item.active{background:var(--pri-soft);color:var(--pri);font-weight:600}
.nav-item .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;min-width:17px;text-align:center;line-height:17px;font-weight:600}
.nav-foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx3)}
#sync-dot{width:8px;height:8px;border-radius:50%;background:var(--tx3)}
#sync-dot.ok{background:var(--ok)} #sync-dot.loading{background:var(--warn)} #sync-dot.offline{background:var(--danger)}
/* ---------- 主区 ---------- */
#main{flex:1;min-width:0;padding:20px 26px 60px;max-width:1180px}
#topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
#topbar h1{font-size:20px}
#topbar .sub{color:var(--tx3);font-size:12.5px;margin-top:1px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--tx);transition:.15s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn-pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(232,86,42,.28)}
.btn-pri:hover{background:linear-gradient(135deg,#D64C24,#E07E30);color:#fff;box-shadow:0 6px 18px rgba(232,86,42,.34)}
.btn-sm{min-height:34px;padding:0 13px;font-size:13px;border-radius:9px}
.btn-danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
/* 新建菜单 */
#new-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(23,24,28,.18);padding:6px;z-index:60;min-width:168px}
#new-menu.show{display:block}
#new-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:9px;font-size:13.5px;color:var(--tx);text-align:left}
#new-menu button:hover{background:var(--pri-soft);color:var(--pri)}
#new-menu button svg{width:15px;height:15px;fill:currentColor}
.view{display:none}
.view.active{display:block}
/* ---------- 卡片 ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(20,22,28,.045);padding:20px 22px;margin-bottom:14px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:13px}
.card-h b{font-size:15.5px}
.card-h .cnt{color:var(--tx3);font-weight:400;font-size:12px}
.card-h .more{font-size:12.5px;color:var(--pri);cursor:pointer;font-weight:500}
/* ---------- 首页顶部：轻量问候 + 今日状态 ---------- */
.greet{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 26px;margin-bottom:14px}
.g-kicker{font-size:11.5px;color:var(--pri);font-weight:700;letter-spacing:.14em}
.g-title{font-size:23px;font-weight:800;letter-spacing:-.01em;margin-top:3px}
.g-sub{font-size:12.5px;color:var(--tx3);margin-top:4px}
.g-stats{display:flex;gap:9px;flex-wrap:wrap}
.g-stat{background:var(--bg);border-radius:13px;padding:10px 15px;min-width:88px;cursor:pointer;text-align:center;transition:.15s;border:1px solid transparent}
.g-stat:hover{background:var(--pri-soft);border-color:#F6C9B4;transform:translateY(-1px)}
.g-stat .n{font-size:19px;font-weight:800;letter-spacing:-.02em}
.g-stat .l{font-size:11px;color:var(--tx3);margin-top:1px}
.g-stat.hot .n{color:var(--danger)} .g-stat.money .n{color:var(--ok)} .g-stat.warn .n{color:var(--warn)}
/* ---------- 随手记录 ---------- */
.capture-box{background:linear-gradient(135deg,#FFF8F4,#FFFFFF);border:1.5px solid #F6C9B4}
.capture-row{display:flex;gap:10px;align-items:flex-start}
.capture-row textarea{min-height:52px;flex:1}
.capture-meta{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cat-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px dashed var(--pri);color:var(--pri);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;min-height:32px}
.cat-chip small{font-weight:400;color:var(--tx3)}
.hint{font-size:12px;color:var(--tx3)}
/* ---------- 今日作战 ---------- */
.battle-tier{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;margin:16px 0 6px}
.battle-tier:first-child{margin-top:0}
.battle-tier .tdot{width:10px;height:10px;border-radius:50%}
.battle-tier.t1{color:var(--danger)} .battle-tier.t1 .tdot{background:var(--danger)}

.money-cell.hot .n{color:var(--danger)} .money-cell.ok .n{color:var(--ok)} .money-cell.warn .n{color:var(--warn)}

.mod-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.mod-toolbar input[type=text]{max-width:260px}
.mod-toolbar select{width:auto;min-width:110px}
.mod-toolbar .spacer{flex:1}
/* ---------- 记录卡片 ---------- */
.rec-card{background:#fff;border-radius:15px;box-shadow:0 1px 2px rgba(20,22,28,.04);border:1px solid var(--line);border-left:3px solid transparent;padding:15px 17px;margin-bottom:10px}

#modal-root{display:none;position:fixed;inset:0;background:rgba(23,24,28,.48);z-index:100;align-items:flex-start;justify-content:center;padding:3vh 14px;overflow-y:auto}

  function cls(v){return v>=75?'good':(v>=45?'warn':'bad');}
  return [
    {label:'内容生产',pct:content,sub:'已发布 '+pubN+' / 全部 '+T.length+' 条选题',cls:cls(content)},
    {label:'客户项目',pct:proj,sub:actP.length+' 个进行中 · '+(actP.length-onTime)+' 个临近逾期',cls:cls(proj)},
    {label:'客户跟进',pct:follow,sub:'7 天内沟通 '+freshC+' / '+actC.length+' 个客户',cls:cls(follow)},
    {label:'回款进度',pct:pay,sub:'已收 '+fmtMoney(got)+' / 合同 '+fmtMoney(contract),cls:cls(pay)}
  ];
}

function moneyData(){
  var mk=todayStr().slice(0,7);
  var P=rows('projects');

  P.forEach(function(p){
    if(gv(p,'项目状态')!=='洽谈中'&&dstr(gv(p,'成交日期')).slice(0,7)===mk){mDeal+=num(gv(p,'合同金额'));mGot+=num(gv(p,'已收金额'));}
  });

  return {mDeal:mDeal,mGot:mGot,mWait:mDeal-mGot,unpaidN:unpaid.length,unpaidSum:unpaidSum,unpaidCustN:Object.keys(custSet).length,doneUnpaid:doneUnpaid,unpaid:unpaid};
}
/* 今日作战：紧急程度 × 截止时间 × 业务价值 自动排序 */
function buildBattle(){
  var today=todayStr();
  var items=[];
  function prW(v){return v==='P0 紧急'?3:(v==='P1 重要'?2:1);}
  rows('tasks').forEach(function(r){
    if(gv(r,'状态')==='已完成')return;
    var d=dstr(gv(r,'截止日期'));
    var diff=d?Math.round((new Date(d)-new Date(today))/86400000):99;
    var w=prW(gv(r,'优先级'));
    var tier=diff<0?1:(diff===0?(w>=2?1:2):(diff<=2?(w>=2?2:3):3));
    if(tier>3)return;
    var sub=[];
    if(diff<0)sub.push('已逾期 '+(-diff)+' 天 · 原定 '+fmtD(d));
    else if(diff===0)sub.push('今天截止');
    else sub.push(fmtD(d)+' 截止（还剩 '+diff+' 天）');
    if(gv(r,'优先级'))sub.push(gv(r,'优先级'));
    if(gv(r,'关联账号'))sub.push(gv(r,'关联账号'));
    items.push({tier:tier,date:d||'9999',w:w,tag:diff<0?'逾期':'任务',tagCls:diff<0?'red':'org',
      txt:stripEx(gv(r,'任务内容')),sub:sub.join(' · '),
      acts:'<button class="mini-btn go" data-act="task-done" data-id="'+esc(r._id)+'">完成</button>'+(diff<0?'<button class="mini-btn" data-act="task-postpone" data-id="'+esc(r._id)+'">顺延今天</button>':'')});
  });
  rows('topics').forEach(function(r){
    var st=gv(r,'进度状态');
    if(st==='已发布')return;
    var d=dstr(gv(r,'预计发布日期'));
    if(!d)return;
    var diff=Math.round((new Date(d)-new Date(today))/86400000);
    if(diff>2)return;
    var tier=diff<0?1:(diff<=1?2:3);
    var late=diff<0;
    items.push({tier:tier,date:d,w:2,tag:late?'该发了':'待发布',tagCls:late?'red':'blu',
      txt:stripEx(gv(r,'选题标题')),sub:(late?'原计划 '+fmtD(d)+' 发布，已过期 · ':'计划 '+fmtD(d)+' · ')+st+(gv(r,'所属账号')?' · '+gv(r,'所属账号'):''),
      acts:'<button class="mini-btn go" data-act="goto" data-view="topics">去处理</button>'});
  });
  rows('accounts').forEach(function(r){
    if(gv(r,'账号状态')==='暂停')return;
    var idle=daysAgo(dstr(gv(r,'最近发布时间')));
    var warn=gv(r,'账号状态')==='待更新'||(idle!==null&&idle>=5);
    if(!warn)return;
    var tier=(gv(r,'账号状态')==='待更新'||(idle!==null&&idle>=7))?2:3;
    items.push({tier:tier,date:'9997',w:2,tag:'账号',tagCls:'org',
      txt:stripEx(gv(r,'账号名称'))+' 该更新了',
      sub:(gv(r,'平台')||'')+(idle!==null?' · 已 '+idle+' 天没发':' · 未记录最近发布')+(gv(r,'所属客户')?' · 客户：'+gv(r,'所属客户'):''),
      acts:'<button class="mini-btn go" data-act="acct-open" data-id="'+esc(r._id)+'">账号作战室</button>'});
  });
  rows('customers').forEach(function(r){
    if(gv(r,'合作阶段')==='暂停流失')return;
    var d=dstr(gv(r,'下次跟进时间'));
    if(!d||d>addDays(3))return;
    var diff=Math.round((new Date(d)-new Date(today))/86400000);
    items.push({tier:diff<0?2:3,date:d,w:2,tag:diff<0?'该跟了':'跟进',tagCls:'ppl',
      txt:'跟进客户：'+stripEx(gv(r,'客户名称')),
      sub:(diff<0?'原计划 '+fmtD(d)+'，已过期 · ':'计划 '+fmtD(d)+' · ')+(gv(r,'合作阶段')||'')+(gv(r,'客户核心问题')?' · 痛点：'+stripEx(gv(r,'客户核心问题')).slice(0,20):''),
      acts:'<button class="mini-btn go" data-act="cust-follow" data-id="'+esc(r._id)+'">记为已跟进</button><button class="mini-btn" data-act="cust-open" data-id="'+esc(r._id)+'">档案</button>'});
  });
  rows('projects').forEach(function(r){
    var st=gv(r,'项目状态');
    if(['洽谈中','已交付','已结算'].indexOf(st)>-1)return;
    var d=dstr(gv(r,'交付截止'));
    if(!d)return;
    var diff=Math.round((new Date(d)-new Date(today))/86400000);
    if(diff>7)return;
    var tier=diff<0?1:(diff<=3?2:3);
    var due=num(gv(r,'合同金额'))-num(gv(r,'已收金额'));
    items.push({tier:tier,date:d,w:3,tag:'交付',tagCls:'grn',
      txt:stripEx(gv(r,'项目名称')),
      sub:(diff<0?'交付日 '+fmtD(d)+' 已逾期！':fmtD(d)+' 交付（还剩 '+diff+' 天）')+' · '+st+(due>0?' · <span class="risk">待收 '+fmtMoney(due)+'</span>':''),
      acts:'<button class="mini-btn go" data-act="proj-open" data-id="'+esc(r._id)+'">进入项目</button>'+(diff<0?'':'<button class="mini-btn" data-act="proj-delivered" data-id="'+esc(r._id)+'">标记已交付</button>')});
  });
  rows('projects').forEach(function(r){
    if(gv(r,'项目状态')!=='已交付')return;
    var due=num(gv(r,'合同金额'))-num(gv(r,'已收金额'));
    if(due<=0)return;
    items.push({tier:3,date:'9998',w:3,tag:'回款',tagCls:'red',
      txt:'该收钱了：'+stripEx(gv(r,'项目名称')),
      sub:'已交付未结算 · 待回款 '+fmtMoney(due)+(gv(r,'客户')?' · '+gv(r,'客户'):''),
      acts:'<button class="mini-btn go" data-act="proj-open" data-id="'+esc(r._id)+'">进入项目</button>'});
  });
  items.sort(function(a,b){return a.tier-b.tier||a.date.localeCompare(b.date)||b.w-a.w;});
  return items;
}

function ringSVG(p,cls){

  return '<svg viewBox="0 0 74 74"><circle cx="37" cy="37" r="'+r+'" fill="none" stroke="#E7E9ED" stroke-width="7"/>'
    +'<circle cx="37" cy="37" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg>';

function funnelHTML(stages,color){

  var h='';

    var w=Math.max(8,Math.round(s.count/max*100));
    h+='<div class="funnel-row" data-act="'+s.act+'" data-key="'+esc(s.key)+'">'
      +'<div class="f-count">'+s.count+'</div>'

      +'<div class="f-label">'+esc(s.label)+'</div></div>';

  return h;

/* ================= 渲染层：模块视图 ================= */
function statusCell(m,row){
  if(!m.statusField)return'';
  var opts=SCHEMA_OPTS[m.id]&&SCHEMA_OPTS[m.id][m.statusField]||m.statusOpts.map(function(t){return{text:t};});
  var cur=gv(row,m.statusField)||'';
  var h='<select data-act="quickset" data-m="'+m.id+'" data-id="'+esc(row._id)+'">';
  opts.forEach(function(o){h+='<option value="'+esc(o.text)+'"'+(o.text===cur?' selected':'')+'>'+esc(o.text)+'</option>';});
  return h+'</select>';
}
function metaChips(m,row){
  var chips='';
  m.fields.forEach(function(f){
    if(!f.l||f.n===m.primary||f.long)return;
    var v=gv(row,f.n);
    if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length))return;
    if(f.t==='select'){chips+='<span class="chip '+chipClass(v)+'">'+esc(stripEx(v))+'</span>';}
    else if(f.t==='multi_select'){v.forEach(function(t){chips+='<span class="chip blu">'+esc(t)+'</span>';});}
    else if(f.t==='date'){chips+='<span class="chip gray">'+f.n+' '+fmtD(v)+'</span>';}
    else if(f.t==='number'){chips+='<span class="chip gray">'+f.n+' '+num(v)+'</span>';}
    else if(f.t==='currency'){chips+='<span class="chip grn">'+fmtMoney(v)+'</span>';}
    else{chips+='<span class="chip gray">'+esc(stripEx(String(v)).slice(0,20))+'</span>';}
  });
  return chips;
}
function renderRow(m,row){
  var today=todayStr();
  var div=document.createElement('div');
  div.className='rec-card';
  var st=gv(row,m.statusField);
  var isDone=m.doneVal&&st===m.doneVal;
  if(isDone)div.classList.add('done');
  if(!isDone&&m.dateField&&dstr(gv(row,m.dateField))&&dstr(gv(row,m.dateField))<today)div.classList.add('overdue');
  var title=esc(stripEx(gv(row,m.primary))||'(无标题)');
  var titleAttrs=m.detail?' data-act="'+m.detail+'-open" data-id="'+esc(row._id)+'"':'';
  var h='<div class="rec-top"><div class="rec-title'+(m.detail?' clickable':'')+'"'+titleAttrs+'>'+title+'</div>'
    +'<div class="rec-acts">'+statusCell(m,row)
    +'<button class="mini-btn" data-act="edit" data-m="'+m.id+'" data-id="'+esc(row._id)+'">编辑</button>'
    +'<button class="mini-btn" data-act="del" data-m="'+m.id+'" data-id="'+esc(row._id)+'">删</button></div></div>';
  var chips=metaChips(m,row);
  if(m.id==='projects'){
    var due=num(gv(row,'合同金额'))-num(gv(row,'已收金额'));
    if(due>0)chips+='<span class="chip red">待收 '+fmtMoney(due)+'</span>';
    chips+='<span class="chip grn">利润 '+fmtMoney(num(gv(row,'合同金额'))-num(gv(row,'项目成本')))+'</span>';
  }
  if(chips)h+='<div class="rec-meta">'+chips+'</div>';
  var bodyField=null;
  m.fields.forEach(function(f){if(f.long&&f.l&&f.n!==m.primary&&!bodyField)bodyField=f.n;});
  if(bodyField){var bv=gv(row,bodyField);if(bv)h+='<div class="rec-body">'+esc(stripEx(bv))+'</div>';}
  div.innerHTML=h;
  markDb(div,m.dbId);
  return div;
}

function updateBadge(m){
  var badge=document.getElementById('badge-'+m.id);

  var total=state.data[m.id]||[];

  if(m.statusOpts){open=total.filter(function(r){var st=gv(r,m.statusField);return st!==m.statusOpts[m.statusOpts.length-1];});}
  var n=open.length;

function findRow(m,id){
  var rowsArr=state.data[m.id]||[];
  for(var i=0;i<rowsArr.length;i++){if(rowsArr[i]._id===id)return rowsArr[i];}
  return null;
}
function fieldInput(f,val){
  var name='f_'+f.n;
  var v=val===null||val===undefined?'':val;
  if(f.t==='select'){
    var opts=SCHEMA_OPTS[state._formModule]&&SCHEMA_OPTS[state._formModule][f.n]||f.opts.map(function(t){return{text:t};});
    var h='<select name="'+name+'" data-ftext="1"><option value="">请选择</option>';
    opts.forEach(function(o){h+='<option value="'+esc(o.text)+'"'+(o.text===v?' selected':'')+'>'+esc(o.text)+'</option>';});
    return h+'</select>';
  }
  if(f.t==='multi_select'){
    var sel=Array.isArray(v)?v:[];
    var opts2=SCHEMA_OPTS[state._formModule]&&SCHEMA_OPTS[state._formModule][f.n]||f.opts.map(function(t){return{text:t};});
    var h2='<div class="ms-box" data-ms="'+name+'">';
    opts2.forEach(function(o){
      var on=sel.indexOf(o.text)>-1;
      h2+='<button type="button" class="ms-opt'+(on?' on':'')+'" data-msname="'+name+'" data-val="'+esc(o.text)+'">'+esc(o.text)+'</button>';
    });
    return h2+'</div>';
  }
  if(f.t==='date'){return '<input type="date" name="'+name+'" value="'+esc(dstr(v))+'">';}
  if(f.t==='number'||f.t==='currency'){return '<input type="number" step="any" name="'+name+'" value="'+(v===''||v===null||v===undefined?'':esc(v))+'" placeholder="0">';}
  if(f.long){return '<textarea name="'+name+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';}
  return '<input type="text" name="'+name+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">';
}
function openForm(m,row,preset){
  state._formModule=m.id;state._formEdit=row||null;
  var h='<h3>'+(row?'编辑 · '+m.title:'新建 · '+m.title)+'</h3><div class="m-tagline">'+m.tagline+'</div><form id="rec-form"><div class="form-grid">';
  m.fields.forEach(function(f){
    if(!f.f)return;
    h+='<div class="form-item'+(f.long||f.t==='multi_select'?' full':'')+'"><label>'+esc(f.n)+'</label>'+fieldInput(f,row?gv(row,f.n):null)+'</div>';
  });
  h+='</div><div class="form-foot"><button type="button" class="btn" data-act="close-modal">取消</button>'
   +'<button type="submit" class="btn btn-pri" id="rec-submit">保存</button></div></form>';
  openModal(h);
  if(!row)restoreFormCache(m);
  if(preset){
    for(var k in preset){
      var el=document.querySelector('[name="f_'+k+'"]');
      if(!el)continue;
      if(el.tagName==='SELECT'){
        for(var i=0;i<el.options.length;i++){if(el.options[i].value===preset[k]){el.selectedIndex=i;break;}}
      }else{el.value=preset[k];}
    }
  }
  bindForm(m);
}
function collectForm(m){
  var props={};
  m.fields.forEach(function(f){
    if(!f.f)return;
    var el=document.querySelector('[name="f_'+f.n+'"]');
    if(!el)return;
    var v;
    if(f.t==='multi_select'){
      var picked=[];
      document.querySelectorAll('[data-msname="f_'+f.n+'"].on').forEach(function(b){picked.push(b.getAttribute('data-val'));});
      if(picked.length)props[f.n]={multi_select:picked};
      return;
    }
    v=el.value;
    if(v===''||v===null){return;}
    if(f.t==='select'){props[f.n]={select:v};}
    else if(f.t==='date'){props[f.n]={date:v};}
    else if(f.t==='number'){var n1=parseFloat(v);if(!isNaN(n1))props[f.n]={number:n1};}
    else if(f.t==='currency'){var n2=parseFloat(v);if(!isNaN(n2))props[f.n]={currency:n2};}
    else{props[f.n]={text:v};}
  });
  return props;
}
function saveFormCache(m){
  try{
    if(state._formEdit)return;
    var c={};
    m.fields.forEach(function(f){
      if(!f.f)return;
      var el=document.querySelector('[name="f_'+f.n+'"]');
      if(!el)return;
      if(f.t==='multi_select'){var p=[];document.querySelectorAll('[data-msname="f_'+f.n+'"].on').forEach(function(b){p.push(b.getAttribute('data-val'));});c[f.n]=p;}
      else if(el.type!=='date')c[f.n]=el.value;
    });
    localStorage.setItem('wb_svz_form_'+m.id,JSON.stringify(c));
  }catch(e){}
}
function restoreFormCache(m){
  try{
    var raw=localStorage.getItem('wb_svz_form_'+m.id);
    if(!raw)return;
    var c=JSON.parse(raw);
    m.fields.forEach(function(f){
      if(!f.f||!(f.n in c))return;
      var el=document.querySelector('[name="f_'+f.n+'"]');
      if(!el)return;
      if(f.t==='multi_select'){
        var arr=c[f.n]||[];
        document.querySelectorAll('[data-msname="f_'+f.n+'"]').forEach(function(b){
          if(arr.indexOf(b.getAttribute('data-val'))>-1)b.classList.add('on');
        });
      }else if(el.tagName==='SELECT'){
        for(var i=0;i<el.options.length;i++){if(el.options[i].value===c[f.n]){el.selectedIndex=i;break;}}
      }else{el.value=c[f.n];}
    });
  }catch(e){}
}
function clearFormCache(m){try{localStorage.removeItem('wb_svz_form_'+m.id);}catch(e){}}
function bindForm(m){
  var form=document.getElementById('rec-form');
  var timer=null;
  form.addEventListener('input',function(){if(timer)clearTimeout(timer);timer=setTimeout(function(){saveFormCache(m);},300);});
  form.addEventListener('change',function(){saveFormCache(m);});
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var btn=document.getElementById('rec-submit');
    btn.disabled=true;btn.textContent='保存中…';
    var props=collectForm(m);
    var p;
    if(state._formEdit){
      p=db.updateRecord({databaseId:DATABASE_ID&&m.dbId,recordId:state._formEdit._id,properties:props});
    }else{
      p=db.addRecord({databaseId:DATABASE_ID&&m.dbId,properties:props});
    }
    p.then(function(){
      clearFormCache(m);
      closeModal();
      toast('已保存');
      return reloadModule(m);
    }).then(refreshAll).catch(function(err){
      console.error('[database] 保存失败:',err);
      toast('保存失败，已保留你填写的内容');
    }).then(function(){btn=document.getElementById('rec-submit');if(btn){btn.disabled=false;btn.textContent='保存';}});
  });
  form.addEventListener('click',function(e){
    var b=e.target.closest('[data-msname]');
    if(b){b.classList.toggle('on');saveFormCache(m);}
  });
}

function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}
function copyText(txt){
  var done=function(){toast('链接已复制');};
  if(navigator.clipboard&&navigator.clipboard.writeText&&location.protocol!=='file:'){
    navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt);done();});
  }else{fallbackCopy(txt);done();}
}
function openExternal(url){
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||(window.navigator&&window.navigator.standalone===true);
  if(standalone){location.href=url;}
  else{var w=window.open(url,'_blank');if(w){try{w.opener=null;}catch(e){}}else{location.href=url;}}
}

var CAPTURE_CATS=['灵感','观点','素材','选题','待办','客户需求','案例'];
var captureCat='灵感';
function classify(text){
  if(!text)return'灵感';
  if(/(提醒|记得|明天|后天|截止|要做|得做|别忘)/.test(text))return'待办';
  if(/(客户|甲方|预算|报价|需求)/.test(text))return'客户需求';
  if(/(案例|谁谁|有个商家|有个老板)/.test(text))return'案例';
  if(/(选题|拍一条|可以做一期|视频主题)/.test(text))return'选题';
  if(/(我觉得|本质|认知|逻辑|反常识|其实|真相|为什么)/.test(text))return'观点';
  if(/(金句|素材|文案|参考)/.test(text))return'素材';
  return'灵感';
}
function captureDualWrite(cat,text){
  var jobs=[];
  if(cat==='待办'){
    jobs.push(db.addRecord({databaseId:DATABASE_ID&&DB.tasks,properties:{'任务内容':{text:text},'状态':{select:'待办'}}}).then(function(){return reloadModule(getModule('tasks'));}));
  }else if(cat==='选题'){
    jobs.push(db.addRecord({databaseId:DATABASE_ID&&DB.topics,properties:{'选题标题':{text:text},'进度状态':{select:'灵感'}}}).then(function(){return reloadModule(getModule('topics'));}));
  }else if(cat==='素材'||cat==='观点'||cat==='案例'){
    var t=cat==='素材'?'临时灵感':cat;
    jobs.push(db.addRecord({databaseId:DATABASE_ID&&DB.materials,properties:{'素材标题':{text:text.slice(0,30)},'素材内容':{text:text},'素材类型':{select:t},'使用状态':{select:'未使用'}}}).then(function(){return reloadModule(getModule('materials'));}));
  }else if(cat==='客户需求'){
    jobs.push(Promise.resolve().then(function(){toast('已记录为「客户需求」，记得去客户CRM建档案');}));
  }
  return Promise.all(jobs).catch(function(e){console.error('[database] 归档写入失败:',e);});
}
function saveCapture(){
  var ta=document.getElementById('capture-input');
  var text=(ta.value||'').trim();
  if(!text){toast('先写点什么吧');return;}
  var btn=document.getElementById('capture-save');
  btn.disabled=true;btn.textContent='保存中…';
  var cat=captureCat;
  db.addRecord({databaseId:DATABASE_ID&&DB.capture,properties:{'记录内容':{text:text},'分类':{select:cat},'归档状态':{select:'未处理'},'记录日期':{date:todayStr()}}})
    .then(function(){ta.value='';try{localStorage.removeItem('wb_svz_capture');}catch(e){}return captureDualWrite(cat,text);})
    .then(function(){return reloadModule(getModule('capture'));})
    .then(refreshAll)
    .then(function(){toast('已记录并归档到「'+cat+'」');})
    .catch(function(err){console.error('[database] 记录失败:',err);toast('保存失败，内容已保留');})
    .then(function(){btn.disabled=false;btn.textContent='保存';});
}

    var nprops={'选题标题':{text:title},'进度状态':{select:'灵感'}};
    if(gv(rv,'所属账号'))nprops['所属账号']={text:gv(rv,'所属账号')};
    db.addRecord({databaseId:DATABASE_ID&&DB.topics,properties:nprops})
      .then(function(){toast('二次选题已进入选题看板');return reloadModule(getModule('topics'));})
      .then(function(){closeModal();refreshAll();})
      .catch(function(err){console.error('[database] 更新失败:',err);toast('创建失败');});
  }
  else if(act==='export'){exportJSON();}
  else if(act==='clear'){clearSamples();}
  else if(act==='quickset'){/* change 事件处理 */}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute&&t.getAttribute('data-act')==='quickset'){
    var m=getModule(t.getAttribute('data-m'));
    var fld=m.statusField;
    db.updateRecord({databaseId:DATABASE_ID&&m.dbId,recordId:t.getAttribute('data-id'),properties:(function(){var p={};p[fld]={select:t.value};return p;})()})
      .then(function(){return reloadModule(m);}).then(refreshAll)
      .catch(function(err){console.error('[database] 更新失败:',err);toast('状态更新失败');});
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='capture-input'){
    try{localStorage.setItem('wb_svz_capture',e.target.value);}catch(err){}
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();document.getElementById('new-menu').classList.remove('show');}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='capture-input'){saveCapture();}
});
document.addEventListener('click',function(e){
  var nm=document.getElementById('new-menu');
  if(nm.classList.contains('show')&&!e.target.closest('#new-menu')&&!e.target.closest('#btn-new'))nm.classList.remove('show');
});
/* ================= 导出 / 清空示例 ================= */
function exportJSON(){
  try{
    var out={exportedAt:new Date().toISOString(),tables:{}};
    MODULES.forEach(function(m){out.tables[m.title]=state.data[m.id]||[];});
    var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='工作台备份_'+todayStr()+'.json';
    a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},800);
    toast('备份已导出');
  }catch(e){toast('导出失败');}
}
function clearSamples(){
  if(!confirm('将删除所有带「【示例】」标记的数据（8 张表），确认继续？'))return;
  if(!confirm('第二次确认：示例数据删除后不可恢复，确定清空？'))return;
  var jobs=[];
  MODULES.forEach(function(m){
    (state.data[m.id]||[]).forEach(function(r){
      var s=JSON.stringify(r);
      if(s.indexOf('【示例】')>-1){
        jobs.push(db.deleteRecord({databaseId:DATABASE_ID&&m.dbId,recordId:r._id}).then(function(){return reloadModule(m);}));
      }
    });
  });
  if(!jobs.length){toast('没有找到示例数据');return;}
  Promise.all(jobs).then(function(){toast('示例数据已清空');refreshAll();})
    .catch(function(err){console.error('[database] 清空失败:',err);toast('部分删除失败，可重试');});
}
/* ================= 初始化 ================= */
function setSync(cls,txt){
  var d=document.getElementById('sync-dot');
  d.className=cls;
  document.getElementById('sync-text').textContent=txt;
}
function init(){
  var d0=new Date();
  document.getElementById('view-date').textContent='一个人的短视频业务操作系统 · '+d0.getFullYear()+'年'+(d0.getMonth()+1)+'月'+d0.getDate()+'日';
  buildNav();
  buildNewMenu();
  buildSections();
  document.getElementById('btn-install').setAttribute('data-act','install-guide');
  document.getElementById('btn-export').setAttribute('data-act','export');
  document.getElementById('btn-clear').setAttribute('data-act','clear');
  document.getElementById('btn-new').setAttribute('data-act','newmenu');
  try{var c=localStorage.getItem('wb_svz_cat');if(c&&CAPTURE_CATS.indexOf(c)>-1)captureCat=c;}catch(e){}
  if(!db){
    state.online=false;setSync('offline','离线模式');
    document.getElementById('offline-banner').classList.add('show');
    refreshAll();
    return;
  }
  setSync('loading','同步中…');
  var schemaPs=MODULES.map(function(m){
    return db.getSchema({databaseId:DATABASE_ID&&m.dbId}).then(function(s){
      SCHEMA_OPTS[m.id]={};
      (s.properties||[]).forEach(function(f){
        if(f.config&&f.config.options){SCHEMA_OPTS[m.id][f.name]=f.config.options;}
      });
    }).catch(function(err){console.error('[database] schema 加载失败:',m.id,err);});
  });
  Promise.all(schemaPs).then(function(){
    return Promise.all(MODULES.map(function(m){return reloadModule(m);}));
  }).then(function(){
    state.online=true;setSync('ok',IS_LOCAL?'本地存储':'已同步');
    refreshAll();
  }).catch(function(err){
    console.error('[database] 初始化失败:',err);
    state.online=false;setSync('offline','离线模式');
    document.getElementById('offline-banner').classList.add('show');
    refreshAll();
  });
  if(db&&typeof db.onUpdated==='function'){
    var tm=null;
    db.onUpdated(function(payload){
      var ids=(payload&&payload.databaseIds)||[];
      var targets=MODULES.filter(function(m){return ids.indexOf(m.dbId)>-1;});
      if(!targets.length)return;
      if(tm)clearTimeout(tm);
      tm=setTimeout(function(){
        Promise.all(targets.map(function(m){return reloadModule(m);})).then(refreshAll).catch(function(){});
      },500);
    });
  }
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}
else{init();}
})();
</script>
</body>
